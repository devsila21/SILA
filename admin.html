<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILA TECH | Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        :root {
            --primary: #0066ff;
            --primary-dark: #0052cc;
            --secondary: #000814;
            --accent: #00d4ff;
            --surface: #0a192f;
            --card: #112240;
            --text: #e6f1ff;
            --text-secondary: #8892b0;
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff4444;
            --premium: #ffd700;
        }
        
        body {
            background: linear-gradient(135deg, #000814 0%, #0a192f 100%);
            color: var(--text);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #000814 0%, #0a192f 100%);
        }
        
        .login-card {
            background: rgba(17, 34, 64, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(0, 102, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        
        .login-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .login-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 8, 20, 0.8);
            border: 2px solid rgba(0, 102, 255, 0.3);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 102, 255, 0.3);
        }
        
        .login-error {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        /* Admin Panel */
        .admin-panel {
            display: none;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
        }
        
        .header-title {
            font-size: 2rem;
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logout-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3);
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(17, 34, 64, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* Settings Section */
        .settings-section {
            background: rgba(17, 34, 64, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: var(--accent);
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .setting-item {
            margin-bottom: 15px;
        }
        
        .setting-label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .setting-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 8, 20, 0.8);
            border: 2px solid rgba(0, 102, 255, 0.3);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }
        
        .setting-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .save-btn {
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 102, 255, 0.3);
        }
        
        /* Contacts Table */
        .contacts-section {
            background: rgba(17, 34, 64, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            padding: 10px 15px;
            background: rgba(0, 8, 20, 0.8);
            border: 2px solid rgba(0, 102, 255, 0.3);
            border-radius: 8px;
            color: var(--text);
            width: 300px;
        }
        
        .export-btn {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px;
            background: rgba(0, 102, 255, 0.2);
            color: var(--text);
            font-weight: 600;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 102, 255, 0.2);
        }
        
        tr:hover {
            background: rgba(0, 102, 255, 0.1);
        }
        
        .contact-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(255, 68, 68, 0.3);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .page-btn {
            padding: 8px 15px;
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid var(--primary);
            border-radius: 5px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover, .page-btn.active {
            background: var(--primary);
        }
        
        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: #000;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .toast.error {
            background: var(--danger);
            color: white;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="login-screen">
        <div class="login-card">
            <h1 class="login-title">ADMIN PANEL</h1>
            <input type="password" class="login-input" id="pin-input" placeholder="Enter PIN" maxlength="8">
            <button class="login-btn" id="login-btn">
                <i class="fas fa-lock-open"></i> LOGIN
            </button>
            <div class="login-error" id="login-error">Invalid PIN</div>
        </div>
    </div>
    
    <!-- Admin Panel -->
    <div class="admin-panel" id="admin-panel">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h1 class="header-title">SILA TECH ADMIN</h1>
                <button class="logout-btn" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> LOGOUT
                </button>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-contacts">0</div>
                    <div class="stat-label">Total Contacts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="today-contacts">0</div>
                    <div class="stat-label">Today's Joins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="target-progress">0%</div>
                    <div class="stat-label">Progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="visitors-count">0</div>
                    <div class="stat-label">Live Visitors</div>
                </div>
            </div>
            
            <!-- Settings -->
            <div class="settings-section">
                <h2 class="section-title"><i class="fas fa-cog"></i> Website Settings</h2>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label class="setting-label">Target Contacts</label>
                        <input type="number" class="setting-input" id="target-input" min="1" max="1000">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">WhatsApp Group Link</label>
                        <input type="text" class="setting-input" id="group-link-input">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">WhatsApp Channel Link</label>
                        <input type="text" class="setting-input" id="channel-link-input">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Group Description</label>
                        <input type="text" class="setting-input" id="group-desc-input" placeholder="Connect with community">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Channel Description</label>
                        <input type="text" class="setting-input" id="channel-desc-input" placeholder="Get latest updates">
                    </div>
                </div>
                <button class="save-btn" id="save-settings">
                    <i class="fas fa-save"></i> SAVE SETTINGS
                </button>
            </div>
            
            <!-- Contacts Table -->
            <div class="contacts-section">
                <div class="table-header">
                    <h2 class="section-title"><i class="fas fa-users"></i> Contacts List</h2>
                    <div class="search-box">
                        <input type="text" class="search-input" id="search-input" placeholder="Search by name or phone...">
                        <button class="export-btn" id="export-btn">
                            <i class="fas fa-download"></i> EXPORT JSON
                        </button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="contacts-table">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Contacts will be loaded here -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination" id="pagination">
                    <!-- Pagination will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast">Settings saved successfully!</div>
    
    <script>
        let currentPage = 1;
        const itemsPerPage = 10;
        let allContacts = [];
        let searchTerm = '';
        
        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/admin/check');
                const result = await response.json();
                
                if (result.success && result.isAdmin) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    loadDashboard();
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }
        
        // Login
        document.getElementById('login-btn').addEventListener('click', async () => {
            const pin = document.getElementById('pin-input').value;
            const errorDiv = document.getElementById('login-error');
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    loadDashboard();
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.style.display = 'block';
            }
        });
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/admin/logout', { method: 'POST' });
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('pin-input').value = '';
        });
        
        // Load dashboard data
        async function loadDashboard() {
            await loadSettings();
            await loadContacts();
            loadVisitors();
        }
        
        // Load settings
        async function loadSettings() {
            try {
                const response = await fetch('/api/settings');
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('target-input').value = result.data.target;
                    document.getElementById('group-link-input').value = result.data.group_link;
                    document.getElementById('channel-link-input').value = result.data.channel_link;
                    document.getElementById('group-desc-input').value = result.data.group_description || '';
                    document.getElementById('channel-desc-input').value = result.data.channel_description || '';
                }
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }
        
        // Save settings
        document.getElementById('save-settings').addEventListener('click', async () => {
            const settings = {
                target: document.getElementById('target-input').value,
                group_link: document.getElementById('group-link-input').value,
                channel_link: document.getElementById('channel-link-input').value,
                group_description: document.getElementById('group-desc-input').value,
                channel_description: document.getElementById('channel-desc-input').value
            };
            
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('Settings saved successfully!');
                }
            } catch (error) {
                console.error('Error saving settings:', error);
                showToast('Error saving settings', 'error');
            }
        });
        
        // Load contacts
        async function loadContacts() {
            try {
                const response = await fetch('/api/contacts');
                const result = await response.json();
                
                if (result.success) {
                    allContacts = result.data;
                    updateStats();
                    filterAndDisplayContacts();
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
            }
        }
        
        // Update stats
        function updateStats() {
            const total = allContacts.length;
            const target = parseInt(document.getElementById('target-input').value) || 200;
            const percent = Math.round((total / target) * 100);
            
            // Today's joins
            const today = new Date().toDateString();
            const todayJoins = allContacts.filter(c => 
                new Date(c.created_at).toDateString() === today
            ).length;
            
            document.getElementById('total-contacts').textContent = total;
            document.getElementById('today-contacts').textContent = todayJoins;
            document.getElementById('target-progress').textContent = percent + '%';
        }
        
        // Load visitors
        async function loadVisitors() {
            try {
                const response = await fetch('/api/visitors');
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('visitors-count').textContent = result.count;
                }
            } catch (error) {
                console.error('Error loading visitors:', error);
            }
            
            setTimeout(loadVisitors, 10000);
        }
        
        // Filter and display contacts
        function filterAndDisplayContacts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = allContacts.filter(contact => 
                contact.name.toLowerCase().includes(searchTerm) ||
                contact.phone.includes(searchTerm)
            );
            
            displayContacts(filtered);
        }
        
        // Display contacts with pagination
        function displayContacts(contacts) {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedContacts = contacts.slice(start, end);
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            paginatedContacts.forEach(contact => {
                const date = new Date(contact.created_at).toLocaleDateString();
                const time = new Date(contact.created_at).toLocaleTimeString();
                
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>
                        ${contact.photo ? 
                            `<img src="${contact.photo}" class="contact-photo" alt="Photo">` : 
                            '<div style="width:40px;height:40px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user"></i></div>'}
                    </td>
                    <td>${contact.name}</td>
                    <td>${contact.phone}</td>
                    <td>${date}<br><small>${time}</small></td>
                    <td>
                        <button class="delete-btn" onclick="deleteContact(${contact.id})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                `;
            });
            
            // Update pagination
            updatePagination(contacts.length);
        }
        
        // Update pagination
        function updatePagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            pagination.innerHTML = html;
        }
        
        // Go to page
        window.goToPage = (page) => {
            currentPage = page;
            filterAndDisplayContacts();
        };
        
        // Search input
        document.getElementById('search-input').addEventListener('input', () => {
            currentPage = 1;
            filterAndDisplayContacts();
        });
        
        // Delete contact
        window.deleteContact = async (id) => {
            if (!confirm('Are you sure you want to delete this contact?')) return;
            
            try {
                const response = await fetch(`/api/contacts/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('Contact deleted successfully!');
                    loadContacts();
                }
            } catch (error) {
                console.error('Error deleting contact:', error);
                showToast('Error deleting contact', 'error');
            }
        };
        
        // Export contacts as JSON
        document.getElementById('export-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/export');
                const result = await response.json();
                
                if (result.success) {
                    const dataStr = JSON.stringify(result.data, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `sila_contacts_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                }
            } catch (error) {
                console.error('Error exporting contacts:', error);
                showToast('Error exporting contacts', 'error');
            }
        });
        
        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type === 'error' ? 'error' : '');
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        // Check auth on load
        checkAuth();
        
        // Auto refresh contacts every 30 seconds
        setInterval(() => {
            if (document.getElementById('admin-panel').style.display === 'block') {
                loadContacts();
            }
        }, 30000);
    </script>
</body>
</html>
